# Deployment settings for Netlify. Safe to delete if you host elsewhere.
[build]
  publish = "."

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Every origin below is one the site actually uses:
    #   formspree.io                  - the contact form (fetch + no-JS fallback POST)
    #   *.netlify.app (frame-src)     - the click-to-load store demo on portfolio.html
    #   cloudflareinsights.com        - pre-authorised so the commented-out analytics
    #                                   snippet works the moment you switch it on
    # 'unsafe-inline' is required by the inline theme script and inline style attributes.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io https://cloudflareinsights.com; form-action 'self' https://formspree.io; frame-src https://bucolic-dusk-3e447d-e-commerce-demo.netlify.app; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
